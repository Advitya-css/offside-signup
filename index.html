<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offside Social · Pick your club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#ded5c4; --sand2:#d2c7b2; --paper:#f8f7f1; --brown:#6c4c3f; --ink:#262221; --night:#2d2624;
  --sky:#afc6d6; --sky-t:#d4e1ea; --red:#b8432f; --mustard:#d9a93a; --mustard-t:#efdca6;
  --muted:#7b6a5f; --line:#e2dac8;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --wide:'Syne',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}

/* hero, after the poster */
.hero{position:relative;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(180deg,var(--sand) 0,var(--sand) 58%,#9c8374 74%,var(--brown) 86%,var(--night) 100%);padding:22px 24px 0;min-height:330px;display:grid;align-content:start}
.hero .logo{color:var(--brown);width:132px;display:block}
.hero .logo svg,.hero .ttl svg{display:block;width:100%;height:auto}
.hero .ttl{color:var(--brown);width:min(100%,640px);margin-top:6px}
.hero .ed{font:500 clamp(18px,2.4vw,26px)/1.1 var(--body);color:var(--brown);margin-top:10px}
.hero .rings{position:absolute;right:-60px;top:-40px;width:300px;color:var(--brown);opacity:.14;pointer-events:none}
.hero .rings svg{width:100%;height:auto;display:block}
.hero .rings{}
.tags{display:grid;width:max-content;max-width:100%;margin:22px 0 0 -24px;font:700 14px var(--wide)}
.tags span{padding:7px 18px 7px 24px}
.tags .t1{background:var(--sand);color:var(--brown)}
.tags .t2{background:var(--sky)}
.tags .t3{background:var(--brown);color:var(--paper);text-transform:uppercase;letter-spacing:.04em}
.hero .inv{color:var(--sand);font-size:14px;padding:14px 0 16px}

.preview{background:var(--mustard-t);border:2px solid var(--ink);padding:9px 14px;margin:0 0 16px;font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--paper)}
.panel>header{display:flex;justify-content:space-between;align-items:stretch;gap:10px}
.panel>header h2{background:var(--brown);color:var(--sand);font:800 15px var(--wide);padding:9px 16px}
.panel>header .count{font:800 13px var(--wide);background:var(--sky);padding:5px 10px;margin:6px 10px 0 0;align-self:flex-start;white-space:nowrap}
.panel .body{padding:18px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}

.field{display:grid;gap:5px;margin-bottom:16px}
.field label{font:700 12px var(--wide);color:var(--brown)}
.in{width:100%;background:var(--paper);border:2px solid var(--ink);border-radius:0;padding:12px 13px;font-size:17px;min-width:0}
.in:focus{background:var(--sky-t);outline:none}
.in[aria-invalid="true"]{border-color:var(--red)}

/* club search */
.combo{position:relative}
.combo .in{padding-left:42px}
.combo .mag{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);pointer-events:none;color:var(--brown)}
.combo .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font:700 13px var(--wide);color:var(--brown);padding:8px}
.list{border:2px solid var(--ink);border-top:0;max-height:min(420px,55vh);overflow:auto;background:var(--paper);overscroll-behavior:contain}
.list[hidden]{display:none}
.lh{position:sticky;top:0;z-index:1;background:var(--sand);font:800 12px var(--wide);color:var(--brown);padding:6px 12px;display:flex;justify-content:space-between;gap:8px}
.lh span{font-weight:600;color:var(--muted)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px}
.opt b{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.opt small{grid-column:1;color:var(--muted);font-size:13px;line-height:1.25}
.opt .tk{grid-row:1/3;grid-column:2;font:700 11px var(--wide);background:var(--sand);color:var(--brown);padding:4px 8px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.act,.opt:not([disabled]):hover{background:var(--sky-t)}
.opt[disabled]{cursor:not-allowed}
.opt[disabled] b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.opt mark{background:var(--mustard-t);color:inherit}
.more{padding:10px 12px;color:var(--muted);font-size:14px}
.empty{padding:16px 12px;color:var(--muted)}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--ink);background:var(--sky);padding:10px 12px}
.pick .fl{font-size:26px;line-height:1}
.pick b{display:block;font:800 18px/1.15 var(--wide);overflow-wrap:anywhere}
.pick small{display:block;color:#3d3631}

.btn{background:var(--sky);color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:11px 18px;font:700 15px var(--wide);transition:transform .08s,box-shadow .08s}
.btn:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn.pri{background:var(--ink);color:var(--sand)}
.btn.big{font-size:19px;padding:15px 24px;width:100%}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:var(--paper)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:12px 0 0;padding:10px 12px;font-weight:600;font-size:15px;border-left:6px solid var(--red);background:#f2cfc7}
.msg.ok{border-color:var(--ink);background:var(--sky-t)}
.msg[hidden]{display:none}

/* ticket */
.ticket{border:3px solid var(--ink);background:var(--ink);color:var(--sand);box-shadow:8px 8px 0 var(--brown)}
.ticket .top{padding:16px 18px 6px;font:800 13px var(--wide);color:var(--sky);display:flex;justify-content:space-between;gap:10px}
.ticket .club{font:900 clamp(40px,7vw,64px)/.92 var(--display);text-transform:uppercase;color:var(--paper);padding:0 18px;overflow-wrap:anywhere}
.ticket .club.long{font-size:clamp(32px,5.4vw,50px);overflow-wrap:normal;word-break:normal;hyphens:auto}
.ticket .club.xl{font-size:clamp(26px,4.4vw,40px)}
.ticket .who{padding:10px 18px 16px;font-size:17px}
.ticket .who b{color:var(--sky)}
.ticket .sub{padding:0 18px 14px;color:#cdbfaa;font-size:14px;margin-top:-8px}
.ticket .foot{background:var(--sand);color:var(--ink);padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* who's in */
.slots{list-style:none;margin:0;padding:0;counter-reset:s}
.slots li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.slots li:last-child{border-bottom:0}
.slots .n{font:800 18px var(--wide);color:var(--muted);text-align:center}
.slots b{display:block;font-size:16px;overflow-wrap:anywhere}
.slots small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.slots li.open b{color:var(--muted);font-weight:500}
.slots li.me{background:var(--sky-t);box-shadow:inset 6px 0 0 var(--ink)}
.slots li.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--mustard-t)}to{background:transparent}}
.bar{height:10px;background:var(--sand);margin:0 0 14px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brown);transition:width .4s}
.live{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.live i{width:8px;height:8px;border-radius:50%;background:#4b8a5a}
.live.off i{background:var(--red)}
.full{border:3px solid var(--ink);background:var(--mustard-t);padding:16px 18px}
.full b{font:800 20px var(--wide);display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){
  .wrap{padding:12px 10px 40px}
  .hero{padding:16px 16px 0;min-height:0}
  .tags{margin-left:-16px}
  .panel .body{padding:14px}
  .hero .rings{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.slots .t{font-size:13px;color:var(--muted);white-space:nowrap}
.slots li{grid-template-columns:34px minmax(0,1fr) auto}
.adm{width:100%;border-collapse:collapse;font-size:15px}
.adm th{font:700 11px var(--wide);color:var(--brown);text-align:left;padding:8px 6px;border-bottom:2px solid var(--ink)}
.adm td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.adm td small{display:block;color:var(--muted)}
.adm .n{font:800 16px var(--wide);color:var(--muted);width:30px}
.scroll{overflow-x:auto}
.secret{display:flex;gap:10px;align-items:flex-start;background:var(--sand);padding:10px 12px;font-size:14px;margin-top:14px}
.secret b{font-family:var(--wide)}
</style>
</head>

  /* ================= stores =================

  function previewStore(){
    var K='offside-fb-preview', MK='offside-fb-preview-me', listeners=[];
    function load(){ try{ return JSON.parse(localStorage.getItem(K))||[]; }catch(e){ return []; } }
    function save(r){ try{ localStorage.setItem(K,JSON.stringify(r)); }catch(e){} emit(); }
    var uid; try{ uid=localStorage.getItem(MK); if(!uid){ uid='u'+Math.random().toString(36).slice(2,12); localStorage.setItem(MK,uid); } }catch(e){ uid='u-temp'; }
    function view(){ var rows=load(), taken={}, mine=null;
      rows.forEach(function(r){ taken[r.clubId]=1; if(r.uid===uid) mine=r.clubId; });
      return {ready:true, uid:uid, players:rows.map(function(r){ return {uid:r.uid,name:r.name,at:r.at}; }), taken:taken, mine:mine}; }
    function emit(){ var v=view(); listeners.forEach(function(f){ f(v); }); }
    window.addEventListener('storage', function(e){ if(e.key===K) emit(); });
    return {
      kind:'preview',
      start:function(f){ listeners.push(f); setTimeout(emit,0); },
      claim:function(name, clubId){ return new Promise(function(res,rej){ setTimeout(function(){
        var rows=load(), me=rows.filter(function(r){ return r.uid===uid; })[0];
        if(rows.some(function(r){ return r.clubId===clubId && r!==me; })) return rej(err('taken'));
        if(!me && rows.length>=MAX) return rej(err('full'));
        if(me){ me.name=name; me.clubId=clubId; } else rows.push({uid:uid,name:name,clubId:clubId,at:Date.now()});
        save(rows); res(); },250); }); },
      withdraw:function(){ save(load().filter(function(r){ return r.uid!==uid; })); return Promise.resolve(); },
      admin:{
        signIn:function(){ return Promise.resolve(); }, signOut:function(){ return Promise.resolve(); },
        watch:function(f){ var go=function(){ f({ok:true, email:'preview', rows:load().map(function(r){ return {uid:r.uid,name:r.name,clubId:r.clubId,at:r.at}; })}); }; listeners.push(go); go(); },
        remove:function(u){ save(load().filter(function(r){ return r.uid!==u; })); return Promise.resolve(); }
      }
    };
  }

  function firebaseStore(F){
    var app=F.initializeApp(CFG.firebase), auth=F.getAuth(app), db=F.getFirestore(app);
    var v={ready:false, uid:null, players:[], taken:{}, mine:null}, got={players:0,taken:0,mine:0}, listeners=[], unsubs=[];
    function emit(){ v.ready=got.players&&got.taken&&got.mine; listeners.forEach(function(f){ f(v); }); }
    function fail(e){ listeners.forEach(function(f){ f(v, e); }); }
    function watchAll(uid){
      unsubs.forEach(function(u){ u(); }); unsubs=[]; got={players:0,taken:0,mine:0}; v.uid=uid;
      unsubs.push(F.onSnapshot(F.query(F.collection(db,'players'), F.orderBy('at')), function(s){
        v.players=s.docs.map(function(d){ var x=d.data(); return {uid:d.id, name:String(x.name||''), at:x.at&&x.at.toMillis?x.at.toMillis():Date.now()}; }); got.players=1; emit(); }, fail));
      unsubs.push(F.onSnapshot(F.collection(db,'taken'), function(s){ var t={}; s.docs.forEach(function(d){ t[d.id]=1; }); v.taken=t; got.taken=1; emit(); }, fail));
      unsubs.push(F.onSnapshot(F.doc(db,'mine',uid), function(d){ v.mine=d.exists()?String(d.data().clubId||''):null; got.mine=1; emit(); }, fail));
    }
    var started=false;
    function start(f){
      listeners.push(f);
      if(started) return; started=true;
      F.onAuthStateChanged(auth, function(u){
        if(u) watchAll(u.uid);
        else F.signInAnonymously(auth).catch(function(e){ fail(e); });
      });
    }
    function claim(name, clubId){
      var uid=v.uid; if(!uid) return Promise.reject(err('offline'));
      var isPlayer=v.players.some(function(p){ return p.uid===uid; });
      if(!isPlayer && v.players.length>=MAX) return Promise.reject(err('full'));
      return F.runTransaction(db, function(tx){
        var mineRef=F.doc(db,'mine',uid), takenRef=F.doc(db,'taken',clubId), plRef=F.doc(db,'players',uid);
        return Promise.all([tx.get(mineRef), tx.get(takenRef), tx.get(plRef)]).then(function(r){
          var m=r[0], t=r[1], p=r[2], old=m.exists()?m.data().clubId:null;
          if(t.exists() && old!==clubId) throw err('taken');
          if(old && old!==clubId){ tx.delete(F.doc(db,'claims',old)); tx.delete(F.doc(db,'taken',old)); }
          if(old!==clubId){ tx.set(F.doc(db,'claims',clubId),{owner:uid}); tx.set(takenRef,{}); tx.set(mineRef,{clubId:clubId}); }
          if(p.exists()) tx.update(plRef, {name:name}); else tx.set(plRef, {name:name, at:F.serverTimestamp()});
        });
      });
    }
    function withdraw(){
      var uid=v.uid, c=v.mine, b=F.writeBatch(db);
      if(c){ b.delete(F.doc(db,'claims',c)); b.delete(F.doc(db,'taken',c)); }
      b.delete(F.doc(db,'mine',uid)); b.delete(F.doc(db,'players',uid));
      return b.commit();
    }
    var admin={
      signIn:function(){ return F.signInWithPopup(auth, new F.GoogleAuthProvider()); },
      signOut:function(){ return F.signOut(auth); },
      watch:function(f){
        var owners={}, aUn=[], live=false;
        listeners.push(function(){ if(live) out(); });
        function out(){ var rows=v.players.map(function(p){ return {uid:p.uid, name:p.name, at:p.at, clubId:owners[p.uid]||''}; }); f({ok:true, email:auth.currentUser&&auth.currentUser.email, rows:rows}); }
        F.onAuthStateChanged(auth, function(u){
          aUn.forEach(function(x){ x(); }); aUn=[];
          live=false;
          if(!u || u.isAnonymous){ f({ok:false, signedOut:true}); return; }
          aUn.push(F.onSnapshot(F.collection(db,'claims'), function(s){ owners={}; s.docs.forEach(function(d){ owners[d.data().owner]=d.id; }); live=true; out(); },
            function(e){ live=false; f({ok:false, denied:true, email:u.email, e:e}); }));
        });
      },
      remove:function(u){
        var c=null; // look the club up from the organiser's list
        return F.runTransaction(db, function(tx){
          var mineRef=F.doc(db,'mine',u);
          return tx.get(mineRef).then(function(m){
            c=m.exists()?m.data().clubId:null;
            if(c){ tx.delete(F.doc(db,'claims',c)); tx.delete(F.doc(db,'taken',c)); }
            tx.delete(mineRef); tx.delete(F.doc(db,'players',u));
          });
        });
      }
    };
    return {kind:'firebase', start:start, claim:claim, withdraw:withdraw, admin:admin};
  }

  /* ---------- search ---------- */
  function search(query){
    var nq=norm(query), toks=nq?nq.split(' '):[]; if(!toks.length) return null;
    var out=[];
    CLUBS.forEach(function(c){
      for(var i=0;i<toks.length;i++) if(c.nAll.indexOf(toks[i])<0) return;
      var s=0; if(c.nName===nq) s+=100; if(c.nName.indexOf(nq)===0) s+=50;
      toks.forEach(function(t){ if(c.words.some(function(w){ return w.indexOf(t)===0; })) s+=12; if(c.nName.indexOf(t)>=0) s+=6; });
      out.push({c:c,s:s-c.li*0.05});
    });
    out.sort(function(a,b){ return b.s-a.s || a.c.li-b.c.li || a.c.name.localeCompare(b.c.name); });
    return out.map(function(x){ return x.c; });
  }
  function hl(name, query){
    var toks=norm(query).split(' ').filter(Boolean); if(!toks.length) return esc(name);
    var plain=name.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); if(plain.length!==name.length) return esc(name);
    var marks=new Array(name.length).fill(false);
    toks.forEach(function(t){ var i=plain.indexOf(t); if(i>=0) for(var k=i;k<i+t.length;k++) marks[k]=true; });
    var h='', on=false; for(var i=0;i<name.length;i++){ if(marks[i]&&!on){ h+='<mark>'; on=true; } if(!marks[i]&&on){ h+='</mark>'; on=false; } h+=esc(name[i]); }
    return h+(on?'</mark>':'');
  }

    var o=e.target.closest('.opt'); if(o){ if(!o.disabled) choose(o.dataset.id); return; }
    var rm=e.target.closest('[data-rm]');
    if(rm){ var u=rm.dataset.rm; if(adminArmed!==u){ adminArmed=u; renderAdmin(); setTimeout(function(){ if(adminArmed===u){ adminArmed=''; renderAdmin(); } },4000); return; }
      adminArmed=''; rm.disabled=true; store.admin.remove(u).catch(function(err){ alertish('Could not remove: '+((err&&err.code)||'error')); }); return; }
    var b=e.target.closest('[data-a]'); if(!b) return;
    var a=b.dataset.a;
    if(a==='clear'){ q=''; act=-1; open=true; renderClub(true); refreshList(); }
    if(a==='unpick'){ sel=null; open=true; renderClub(true); refreshList(); }
    if(a==='change'){ mode='change'; armed=false; draftName=myName(); sel=null; q=''; renderForm(); var n=$('club'); if(n) n.focus(); }
    if(a==='cancel'){ mode='form'; sel=null; q=''; renderForm(); }
    if(a==='withdraw'){
      if(!armed){ armed=true; renderForm(); setTimeout(function(){ if(armed){ armed=false; renderForm(); } },4000); return; }
      armed=false; draftName=myName(); store.withdraw().then(function(){ say('You have dropped out. Your club is free again.'); }).catch(function(e){ console.warn(e); });
    }
    if(a==='gsign') store.admin.signIn().catch(function(err){ var m=$('admMsg'); if(m){ m.hidden=false; m.textContent=/unauthorized-domain/.test(err.code)?'This web address is not allowed to sign in yet. Add it under Authentication → Settings → Authorized domains (README step 6).':(/popup/.test(err.code)?'The sign-in window was closed or blocked. Allow pop-ups and try again.':'Sign-in failed ('+err.code+').'); } });
    if(a==='gout') store.admin.signOut();
    if(a==='copy'){ var t=listText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy list'; },1500); }).catch(function(){ window.prompt('Copy this list:', t); }); }
    if(a==='csv'){ var rows=[['Name','Club','In-game name','League','Signed up']].concat(adminRows.map(function(x){ var c=BY[x.clubId]||{}; return [x.name,c.name||'',c.game||'',c.league||'',new Date(x.at).toLocaleString()]; }));
      var csv=rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
      var aEl=document.createElement('a'); aEl.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); aEl.download='offside-social-clubs.csv'; document.body.appendChild(aEl); aEl.click(); aEl.remove(); }
  });
  function alertish(t){ var m=$('admBody'); if(m){ var d=document.createElement('div'); d.className='msg'; d.textContent=t; m.prepend(d); setTimeout(function(){ d.remove(); },5000); } }

  /* ---------- go ---------- */
  function boot(s){
    store=s;
    renderSlots(); renderForm();
    loadTimer=setTimeout(function(){ if(!V.ready){ $('live').className='live off'; $('live').lastChild.textContent='Still connecting…'; } },10000);
    store.start(onData);
    if(ADMIN){ var ar=$('adminArea'), cols=document.querySelector('.cols'); cols.parentNode.insertBefore(ar, cols); ar.style.margin='22px 0 0'; store.admin.watch(renderAdmin); }
  }
  if(!CONFIGURED){
    banner('<b>Preview mode.</b> Firebase isn\'t connected yet, so sign-ups are saved on this device only. Paste your Firebase settings into <b>config.js</b> to make it live (README step 2).');
    boot(previewStore());
  } else {
    import('./firebase.js').then(function(F){ boot(firebaseStore(F)); }).catch(function(e){
      problem='Could not load the sign-up page. Open it from the web address, not as a file on your computer.'; console.warn(e); renderSlots(); renderForm(); });
  }
})();
</script>
</body>
</html>
